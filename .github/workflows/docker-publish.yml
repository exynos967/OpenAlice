name: Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-master
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/exynos967/openalice

jobs:
  publish:
    if: github.repository == 'exynos967/OpenAlice' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/exynos967/OpenAlice
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=openalice-docker-publish
          cache-to: type=gha,mode=max,scope=openalice-docker-publish
